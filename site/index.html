<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="分得清：合租、旅行、聚餐的 AA 账本。免注册、不限每天记几笔，自动算出最少转账方案。" />
  <title>分得清 · 合租旅行 AA 账本</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true">¥</span>分得清</a>
    <span id="mode-badge" class="badge"></span>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="entry-dialog" aria-labelledby="entry-dialog-title">
    <form id="entry-form" method="dialog" novalidate>
      <h2 id="entry-dialog-title">记一笔</h2>
      <label>内容
        <input name="title" maxlength="40" required placeholder="例如：10 月电费" autocomplete="off" />
      </label>
      <label>金额（元）
        <input name="amount" inputmode="decimal" required placeholder="0.00" autocomplete="off" />
      </label>
      <label>谁付的
        <select name="payer" required></select>
      </label>
      <fieldset>
        <legend>谁来分 <button type="button" class="link" id="toggle-all">全选/全不选</button></legend>
        <div id="participants" class="chips"></div>
      </fieldset>
      <fieldset>
        <legend>怎么分</legend>
        <div class="segmented" id="split-mode">
          <label><input type="radio" name="splitMode" value="equal" checked />均摊</label>
          <label><input type="radio" name="splitMode" value="ratio" />按比例</label>
          <label><input type="radio" name="splitMode" value="amount" />按金额</label>
        </div>
        <div id="share-inputs" class="share-inputs" hidden></div>
        <p id="split-preview" class="hint" aria-live="polite"></p>
      </fieldset>
      <label>日期
        <input name="spentOn" type="date" required />
      </label>
      <p class="form-error" id="entry-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="entry-cancel">取消</button>
        <button type="submit" class="btn primary" id="entry-submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="members-dialog" aria-labelledby="members-dialog-title">
    <div class="dialog-body">
      <h2 id="members-dialog-title">成员</h2>
      <p class="hint">退出账本需要先结清余额；历史记录会保留，可以随时恢复。</p>
      <ul id="members-list" class="list members"></ul>
      <form id="member-add-form" class="member-add" novalidate>
        <input name="name" maxlength="20" placeholder="新成员名字" aria-label="新成员名字" autocomplete="off" />
        <button type="submit" class="btn primary small" id="member-add">添加</button>
      </form>
      <p class="form-error" id="members-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="members-close">完成</button>
      </div>
    </div>
  </dialog>

  <noscript><p class="card">需要开启 JavaScript 才能使用分得清。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
